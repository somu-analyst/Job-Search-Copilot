[theme]
# Brand green. The orange Apply accent is applied in CSS — Streamlit's theme
# block only supports a single primary colour.
primaryColor = "#0CAA41"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7FAF8"
textColor = "#0E1A16"
font = "sans serif"
baseRadius = "0.75rem"

[client]
toolbarMode = "minimal"

[server]
headless = true
