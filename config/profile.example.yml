# bfsi-job-hunter — your search config. Edit freely; no code changes needed.

candidate:
  name: "Your Name"
  full_name: "Your Name"
  email: "you@example.com"
  phone: "(555) 555-5555"
  linkedin: "linkedin.com/in/you"
  location: "City, ST"
  visa: "e.g. citizen / GC / H-1B (needs sponsorship)"

narrative:
  headline: "Your headline — seniority, domain, years, and (optionally) marquee employers"
  exit_story: "2-3 sentences: what you've done, your core stack, and where you're headed."
  superpowers:
    - "Achievement 1 with a number (what you did, quantified result)"
    - "Achievement 2 with a number"
    - "Achievement 3 with a number"

location:
  search: "United States"      # location string passed to the board scrapers

filters:
  # Search terms sent to the job boards (one scrape per term per site)
  queries:
    - "fraud analytics"
    - "AML analytics"
    - "financial crimes analyst"
    - "credit risk analytics SAS"
    - "CCAR CECL analyst"
    - "compliance analytics KYC"
    - "SAS Viya"
    - "data governance banking"
    - "risk reporting analyst bank"
    - "mortgage default servicing analytics"
    - "banking analytics consultant"
    - "financial services data analytics"
    - "BFSI analytics"
    - "SAS programmer analyst"
    - "SQL data analyst banking"
    - "Python data analyst financial services"
    - "Tableau developer banking"
    - "compliance analyst bank"
    - "regulatory reporting analyst"
    - "KYC AML analyst"
    - "MIS reporting analyst banking"

  # A title must contain >=1 positive and 0 negative keywords to be kept
  positive:
    [fraud, aml, anti-money, financial crime, bsa, compliance, sanction, kyc,
     cdd, transaction monitoring, ofac, surveillance, credit risk, risk analy,
     risk manager, risk report, model risk, model validation, stress test,
     ccar, cecl, loss forecast, loss mitigation, portfolio risk, portfolio analy,
     collections, recovery, default, mortgage, servicing, regulatory report,
     sec report, external report, call center, contact center, quantitative,
     data analy, analytics, business analyst, business intelligence,
     decision science, data scientist, sas, reporting, mis, data engineer, etl,
     consultant, advisory, consulting, data management, data governance,
     data quality, data steward, master data, metadata, data lineage, insights,
     data strategy, migration, modernization, remediation,
     sql, python, tableau, power bi, viya]

  negative:
    [junior, intern, entry level, ios, android, frontend, front end, php, ruby,
     embedded, firmware, blockchain, web3, salesforce admin, physical security,
     nurse, recruiter, driver, warehouse, retail store, cashier,
     "java ", "java,", javascript, .net, c++, golang, software engineer,
     software developer, full stack, fullstack, devops, sre]

  # Core-fit markers — these titles win when a run hits its cap
  core:
    [fraud, aml, financial crime, credit risk, ccar, cecl, compliance, sas,
     bsa, kyc, risk analy, stress test]

# Free aggregator API keys (optional — sources are skipped if absent)
api_keys:
  adzuna_app_id: ""
  adzuna_app_key: ""
  jooble_key: ""    # 500-request default limit
  jsearch_key: ""   # free tier ~200 requests/MONTH — see scrape.jsearch_requests
  jsearch_via: rapidapi   # where you bought the key. Same vendor, different auth:
                          #   rapidapi     rapidapi.com/letscrape-6bRBa3QguO5/api/jsearch
                          #   openwebninja app.openwebninja.com  (vendor-direct)

scrape:
  board_sites: [indeed, linkedin, google]   # ziprecruiter/glassdoor block scrapers
  jsearch_requests: 3     # JSearch calls per run (1 query each). Free tier is ~200/month,
                          # i.e. ~3 per run at two runs a day. Raise it on a paid plan.
  cascade_min: 5          # stop calling metered APIs once a run has found this many new
                          # jobs (Adzuna runs first, then Jooble, then JSearch). 0 = always
                          # run every source.
  smart_queries: false    # true = the model writes the search terms from your resume each
                          # run instead of using filters.queries (same as --smart-queries).
                          # Falls back to the static list whenever the LLM lane is down.
  # Optional: add proxies to re-enable blocked sites & dodge LinkedIn rate limits.
  # JobSpy round-robins these. Format: "user:pass@host:port" or "host:port".
  # proxies:
  #   - "user:pass@gate.smartproxy.com:7000"

# Gmail lane (opt-in — python run.py --gmail). Pulls jobs out of job-alert
# digest emails you already get (LinkedIn/Indeed/ZipRecruiter/Glassdoor/Jooble).
# One-time setup in src/scrape_gmail.py's docstring; credentials/token files
# are gitignored, never committed.
gmail:
  enabled: true
